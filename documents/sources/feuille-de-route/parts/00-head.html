<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PleasantStay — Fonctionnalités à ajouter, fichiers à modifier, sécurité et ESB</title>
<style>
  @page { size: A4; margin: 15mm 0 17mm; @bottom-left { content: "PleasantStay · Feuille de route ERP"; padding-left: 15mm; font: 7pt 'Noto Sans', sans-serif; color: #8a97a8; } @bottom-right { content: "Page " counter(page) " / " counter(pages); padding-right: 15mm; font: 7pt 'Noto Sans', sans-serif; color: #8a97a8; } }
  @page :first { margin: 0 0 17mm; }
  :root { --teal: #178d80; --teal-dark: #11776d; --teal-50: #e9f7f4; --teal-100: #cfeee7; --navy: #0f2a44; --navy-2: #173a5c; --ink: #1d2f45; --muted: #66768b; --line: #dbe3ea; --soft: #f5f8fb; --high: #c2410c; --high-bg: #fff1e8; --mid: #0f6fb0; --mid-bg: #e8f2fb; --low: #5b6b7f; --low-bg: #eef2f6; --mono: 'DejaVu Sans Mono', 'Noto Sans Mono', monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; color: var(--ink); font-size: 8.3pt; line-height: 1.4; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* Couverture */
  .hero { padding: 14mm 15mm 11mm; color: #fff; background: radial-gradient(120% 140% at 100% 0%, #1f9e8f 0%, rgba(31,158,143,0) 55%), linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); }
  .hero-top { display: flex; justify-content: space-between; align-items: center; }
  .logo { display: flex; align-items: center; gap: 3mm; font-weight: 800; font-size: 16pt; letter-spacing: -.3pt; }
  .logo svg { width: 10mm; height: 10mm; }
  .logo .light { font-weight: 600; color: #9fd9cf; }
  .logo .sub { margin-left: 1mm; font-size: .6em; font-weight: 600; color: #9fd9cf; }
  .hero-ref { text-align: right; font-size: 7.5pt; color: #b8c9da; line-height: 1.6; }
  .hero-ref b { color: #fff; }
  .eyebrow { margin-top: 10mm; font-size: 7.5pt; font-weight: 700; letter-spacing: 1.4pt; text-transform: uppercase; color: #9fd9cf; }
  h1 { margin-top: 2.5mm; font-size: 24pt; line-height: 1.12; font-weight: 800; letter-spacing: -.4pt; }
  h1 em { font-style: normal; color: #7fd6c8; }
  .lead { margin-top: 4mm; max-width: 170mm; font-size: 9.6pt; color: #d7e3ee; line-height: 1.55; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3mm; margin-top: 7mm; }
  .kpi { padding: 3mm 3.2mm; border-radius: 3mm; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); }
  .kpi b { display: block; font-size: 16pt; line-height: 1.1; color: #fff; }
  .kpi span { font-size: 7pt; color: #b8c9da; line-height: 1.3; display: block; }

  .wrap { padding: 0 15mm; }
  .first-page-body { padding: 7mm 15mm 0; }
  h2 { display: flex; align-items: center; gap: 3mm; margin: 6mm 0 3mm; font-size: 12.5pt; color: var(--navy); break-after: avoid; }
  h2 .n { display: inline-grid; place-items: center; min-width: 8mm; height: 8mm; padding: 0 1.5mm; border-radius: 2.2mm; background: var(--teal); color: #fff; font-size: 9.5pt; }
  h2 small { margin-left: auto; font-size: 7.5pt; font-weight: 600; color: var(--muted); }
  h3.sub { font-size: 10pt; color: var(--navy); margin: 4.5mm 0 1.8mm; break-after: avoid; }
  .intro { color: var(--muted); margin: -1mm 0 3mm; }
  p + p { margin-top: 1.6mm; }

  .chap { break-before: page; margin: 0 0 4mm; padding: 5mm 6mm; border-radius: 3mm; color: #fff; background: radial-gradient(120% 160% at 100% 0%, #1f9e8f 0%, rgba(31,158,143,0) 55%), linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); break-after: avoid; }
  .chap .k { font-size: 7pt; font-weight: 700; letter-spacing: 1.3pt; text-transform: uppercase; color: #9fd9cf; }
  .chap h2 { margin: 1mm 0 0; color: #fff; font-size: 15pt; }
  .chap p { margin-top: 1.6mm; color: #d7e3ee; font-size: 8.4pt; max-width: 170mm; }

  .strengths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; }
  .strength { padding: 3mm 3.5mm; border-radius: 2.5mm; background: var(--teal-50); border: 1px solid var(--teal-100); }
  .strength b { display: block; color: var(--teal-dark); font-size: 8.5pt; margin-bottom: .8mm; }
  .strength span { font-size: 7.8pt; color: var(--ink); }

  .toc { margin-top: 1mm; border: 1px solid var(--line); border-radius: 3mm; overflow: hidden; }
  .toc a { display: grid; grid-template-columns: 13mm 1fr 14mm; align-items: baseline; gap: 2mm; padding: 2.3mm 4mm; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; }
  .toc a:first-child { border-top: 0; }
  .toc a.lvl2 { padding: 1.2mm 4mm; font-size: 7.9pt; color: var(--muted); border-top: 0; }
  .toc a.lvl2 b { font-weight: 600; }
  .toc .tk { font-weight: 800; color: var(--teal-dark); }
  .toc .tt b { color: var(--navy); }
  .toc .tt small { display: block; color: var(--muted); font-size: 7.4pt; }
  .toc .tp { text-align: right; font-weight: 700; color: var(--navy); }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; margin-top: 3mm; }
  .card { padding: 3mm 3.5mm; border: 1px solid var(--line); border-radius: 2.5mm; background: var(--soft); break-inside: avoid; }
  .card b.t { display: block; color: var(--navy); margin-bottom: 1mm; }
  .card p, .card li { font-size: 7.8pt; }

  .item { break-inside: avoid; display: grid; grid-template-columns: 9mm 1fr; gap: 3mm; padding: 2.4mm 0; border-top: 1px solid var(--line); }
  .item.first { border-top: 0; }
  .num { display: grid; place-items: center; width: 8mm; height: 8mm; border-radius: 50%; background: var(--soft); border: 1px solid var(--line); color: var(--navy); font-weight: 700; font-size: 8.5pt; }
  .head { display: flex; align-items: baseline; gap: 2.2mm; flex-wrap: wrap; }
  .head h3 { font-size: 9.6pt; color: var(--navy); }
  .tag { font-size: 6.4pt; font-weight: 700; letter-spacing: .5pt; text-transform: uppercase; padding: .5mm 2mm; border-radius: 10mm; }
  .tag.high { color: var(--high); background: var(--high-bg); }
  .tag.mid { color: var(--mid); background: var(--mid-bg); }
  .tag.low { color: var(--low); background: var(--low-bg); }
  .be { font-size: 6.4pt; font-weight: 700; padding: .4mm 2mm; border-radius: 10mm; border: 1px solid; }
  .be.yes { color: var(--navy); border-color: #9fb2c8; background: #fff; }
  .be.no { color: var(--teal-dark); border-color: var(--teal-100); background: var(--teal-50); }
  .why { margin-top: .6mm; color: var(--muted); }
  ul { margin: 1mm 0 0 4.2mm; }
  li { margin: .3mm 0; }
  li::marker { color: var(--teal); }
  .have { margin-top: 1mm; font-size: 7.6pt; color: var(--teal-dark); }
  .have::before { content: "Déjà en place : "; font-weight: 700; }

  .fx { margin-top: 1.4mm; border: 1px solid var(--line); border-radius: 2mm; overflow: hidden; font-size: 6.3pt; line-height: 1.32; }
  .fr { display: grid; grid-template-columns: 15mm 1fr 1fr; }
  .fr > * { padding: .6mm 1.5mm; border-top: 1px solid var(--line); }
  .fr > * + * { border-left: 1px solid var(--line); }
  .fr.fh > * { border-top: 0; background: var(--soft); font-weight: 700; color: var(--muted); font-size: 6.2pt; text-transform: uppercase; letter-spacing: .4pt; font-style: normal; }
  .fr > b { color: var(--navy); font-size: 6.6pt; }
  .fx code, .feat code, td code, .card code, p code, li code { font-family: var(--mono); font-size: 6.1pt; color: #12385e; overflow-wrap: anywhere; }
  .fx code::after { content: " "; }
  .fx .none { color: #9aa7b6; }
  .feat { margin-top: 1.2mm; font-size: 7.4pt; color: var(--ink); }
  .feat b { color: var(--teal-dark); }

  .phases { display: grid; gap: 2mm; }
  .phase { break-inside: avoid; display: grid; grid-template-columns: 30mm 1fr; border: 1px solid var(--line); border-radius: 3mm; overflow: hidden; }
  .phase-side { padding: 2.4mm 3mm; background: var(--navy); color: #fff; }
  .phase-side b { display: block; font-size: 15pt; line-height: 1; color: #7fd6c8; }
  .phase-side span { font-size: 7.5pt; color: #c6d4e2; }
  .phase-body { padding: 2.2mm 3.5mm; }
  .phase-body h4 { font-size: 9.5pt; color: var(--navy); }
  .phase-body p { color: var(--muted); font-size: 8pt; margin-top: .6mm; }

  table { width: 100%; border-collapse: collapse; margin-top: 2mm; font-size: 7.8pt; }
  th { text-align: left; background: var(--navy); color: #fff; padding: 1.8mm 2.2mm; font-size: 6.9pt; letter-spacing: .4pt; text-transform: uppercase; }
  td { padding: 1.1mm 2.2mm; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr { break-inside: avoid; }
  tr:nth-child(even) td { background: var(--soft); }
  table.dense td { padding: 1.2mm 2mm; font-size: 7.3pt; }
  .yes-c { color: var(--high); font-weight: 700; }
  .no-c { color: var(--teal-dark); font-weight: 700; }
  .note { margin-top: 4mm; padding: 3.2mm 4mm; border-left: 3px solid var(--teal); background: var(--teal-50); border-radius: 0 2.5mm 2.5mm 0; font-size: 8pt; break-inside: avoid; }
  .note b.t { display: block; margin-bottom: .8mm; color: var(--navy); }
  .pb { break-before: page; }
  .chap.flow { break-before: auto; margin-top: 4mm; padding: 3.5mm 5mm; }

  .sm { padding: 3mm 0 1mm; border-top: 1px solid var(--line); }
  .sm-top { break-inside: avoid; break-after: avoid; }
  .sm-h { display: flex; align-items: baseline; gap: 2.5mm; flex-wrap: wrap; }
  .sm-h .id { display: inline-grid; place-items: center; min-width: 8mm; height: 6.5mm; padding: 0 1.2mm; border-radius: 1.6mm; background: var(--navy); color: #7fd6c8; font-weight: 800; font-size: 7.6pt; }
  .sm-h h3 { font-size: 9.8pt; color: var(--navy); }
  .meta { display: grid; grid-template-columns: 30mm 1fr; margin-top: 1.5mm; border: 1px solid var(--line); border-radius: 2mm; overflow: hidden; font-size: 7.3pt; }
  .meta > * { padding: .9mm 2mm; border-top: 1px solid var(--line); }
  .meta > *:nth-child(-n+2) { border-top: 0; }
  .meta > b { background: var(--soft); color: var(--navy); font-size: 6.9pt; }
  .meta code { font-family: var(--mono); font-size: 6.3pt; color: #12385e; overflow-wrap: anywhere; }
  .codehead { margin-top: 1.8mm; display: inline-block; padding: .6mm 2.2mm; border-radius: 1.6mm 1.6mm 0 0; background: #1c3350; color: #9fd9cf; font: 6.4pt var(--mono); break-after: avoid; }
  pre.code { background: #0e1b2b; color: #dbe6f1; font-family: var(--mono); font-size: 6.5pt; line-height: 1.34; padding: 2mm 2.6mm; border-radius: 0 2mm 2mm 2mm; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; orphans: 4; widows: 4; }
  pre.code.keep { break-inside: avoid; }
  pre.code .c { color: #7f9bb5; }
  pre.code .s { color: #9fe0c9; }
  pre.code .k { color: #f6be8e; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; }
  .two > div { min-width: 0; }

  .diagram { margin-top: 2mm; border: 1px solid var(--line); border-radius: 3mm; padding: 2mm; background: #fbfdfe; break-inside: avoid; }
  .diagram svg { width: 100%; height: auto; display: block; }
  .uses { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; }
  .use { padding: 3mm 3.5mm; border-radius: 2.5mm; break-inside: avoid; }
  .use.ok { background: var(--teal-50); border: 1px solid var(--teal-100); }
  .use.ko { background: var(--high-bg); border: 1px solid #f5d0bb; }
  .use b.t { display: block; margin-bottom: 1mm; font-size: 8.8pt; }
  .use.ok b.t { color: var(--teal-dark); }
  .use.ko b.t { color: var(--high); }
  .use li { font-size: 7.7pt; }

  .erp { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3mm; }
  .erp .card { background: #fff; }
  .state { display: inline-block; margin-left: 1.5mm; font-size: 6.2pt; font-weight: 700; text-transform: uppercase; letter-spacing: .4pt; color: var(--mid); background: var(--mid-bg); padding: .3mm 1.8mm; border-radius: 10mm; }
  .toc a { padding: 1.7mm 4mm; }
  .toc a.lvl2 { padding: .9mm 4mm; }
  table.recap td { padding: .5mm 2mm; line-height: 1.3; }
  .alert { margin-top: 4mm; padding: 3.2mm 4mm; border-left: 3px solid var(--high); background: var(--high-bg); border-radius: 0 2.5mm 2.5mm 0; font-size: 8pt; break-inside: avoid; }
  .alert b.t { display: block; margin-bottom: .8mm; color: var(--high); }
  .fr.r4 { grid-template-columns: 17mm 1fr 1fr; }
  .state.done { color: var(--teal-dark); background: var(--teal-50); }
  .evt td:first-child code { white-space: nowrap; }
</style>
</head>
<body>
