services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: bd_pleasantstay
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "mongodb://localhost:27017/admin",
          "--eval",
          "db.runCommand({ ping: 1 }).ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./project-hotels-manager-backend
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: bd_pleasantstay
      CORS_ORIGIN: http://localhost:3001,http://127.0.0.1:3001
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-secret}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      JWT_2FA_EXPIRES_IN: 5m
      FRONTEND_URL: http://localhost:3001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./project-hotels-manager
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-http://localhost:3000/api}
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - api
    restart: unless-stopped

  mobile:
    build:
      context: ./hotel-manager-mobile-react
    ports:
      - "127.0.0.1:3002:80"
    restart: unless-stopped

volumes:
  mongo_data:
